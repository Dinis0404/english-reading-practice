<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Reading Lab · 英文閱讀練習</title>
<meta name="description" content="高三以上水平的英文完形填空與閱讀理解練習：計時作答、逐題解析、點詞查義、成績同步。">
<meta name="theme-color" content="#f6f6f9">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden"></header>
  <main id="view"></main>
</div>

<!-- 點詞查義：底部彈出卡 -->
<div id="dict-sheet" class="sheet hidden" role="dialog" aria-label="詞義">
  <div class="sheet-mask"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <div class="dict-word" id="dict-word">word</div>
      <button class="icon-btn" id="dict-close" aria-label="關閉">✕</button>
    </div>
    <div class="dict-phonetic" id="dict-phonetic"></div>
    <div class="dict-meaning" id="dict-meaning"></div>
  </div>
</div>

<!-- 確認對話框 -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-mask"></div>
  <div class="modal-card">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<noscript>此網站需要啟用 JavaScript。</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
